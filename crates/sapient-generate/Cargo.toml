[package]
name        = "sapient-generate"
description = "Text generation for SAPIENT — Pipeline::from_pretrained, KV cache, greedy/top-p/top-k sampling, streaming"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true

[dependencies]
image.workspace = true
sapient-core       = { workspace = true }
sapient-ir         = { workspace = true }
sapient-backends-cpu = { workspace = true }
sapient-io         = { workspace = true }
sapient-runtime    = { workspace = true }
sapient-hub        = { workspace = true }
sapient-tokenizers = { workspace = true }
sapient-models     = { workspace = true }
sapient-audio      = { workspace = true }

thiserror  = { workspace = true }
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tokio-stream = { workspace = true }
tracing    = { workspace = true }
futures    = { workspace = true }
async-trait = { workspace = true }
# Vendored (MIT) with gzip-compressed, externally loadable dictionaries — see
# vendor/misaki-rs/VENDORED.md. Upstream embeds 35.5 MB of JSON in the binary.
misaki-rs = { path = "../../vendor/misaki-rs" }

[features]
default = []
mlx = ["sapient-models/mlx"]
# Cross-platform GPU inference (Vulkan/DX12/Metal via wgpu) — Intel/AMD/Nvidia/Apple.
wgpu = ["sapient-models/wgpu"]
# Live mic/speaker I/O for the speech-to-speech cascade (sapient converse).
audio-io = ["sapient-audio/audio-io"]
# Embed Kokoro's pronunciation dictionaries (7.6 MB gzip) in the binary instead
# of downloading them next to the model on first use. For fully offline builds.
embed-g2p = ["misaki-rs/embed-dict"]

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true }

# Paper 1 de-risking spike: non-AR streaming duplex-codec feasibility harness.
[[example]]
name = "duplex_spike"
path = "examples/duplex_spike.rs"
